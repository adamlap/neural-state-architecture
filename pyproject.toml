[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-state-architecture"
version = "0.4.0"
description = "A state-aware runtime and typed control architecture for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adam" }]
dependencies = []

[project.optional-dependencies]
ml = [
    "torch>=2.0.0,<2.5.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "numpy>=1.24.0,<3.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
research = [
    "torch>=2.0.0,<2.5.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/adamlap/neural-state-architecture"
Documentation = "https://github.com/adamlap/neural-state-architecture/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["nsa*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
