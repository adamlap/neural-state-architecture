name: NSA Predictor Target Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/predictor_target_quality.py'
      - 'tests/test_predictor_target_quality.py'
      - '.github/workflows/experiment-predictor-target-quality.yml'
  push:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/predictor_target_quality.py'
      - 'tests/test_predictor_target_quality.py'
      - '.github/workflows/experiment-predictor-target-quality.yml'

jobs:
  target-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 7, 21, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run target-quality experiment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          PYTHONPATH=. python experiments/self_state/predictor_target_quality.py \
            --seed ${{ matrix.seed }} \
            | tee results/predictor-target-quality-${{ matrix.seed }}.json
      - name: Validate result
        env:
          RESULT: results/predictor-target-quality-${{ matrix.seed }}.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          assert result['finite'] is True
          assert result['summary']['max_security_delta'] == 0.0
          assert len(result['results']) == len(result['perturbations'])
          assert all(-1.0 <= r['correction_oracle_cosine'] <= 1.0 for r in result['results'])
          print('Validated', os.environ['RESULT'])
          PY
      - name: Publish result summary
        run: |
          echo '## Predictor target quality — seed ${{ matrix.seed }}' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('results/predictor-target-quality-${{ matrix.seed }}.json', encoding='utf-8') as f:
              r = json.load(f)
          print('```json')
          print(json.dumps(r['summary'], indent=2))
          print('```')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: predictor-target-quality-seed-${{ matrix.seed }}
          path: results/predictor-target-quality-${{ matrix.seed }}.json

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_predictor_target_quality.py
