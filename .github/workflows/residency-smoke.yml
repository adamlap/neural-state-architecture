name: residency-smoke

on:
  pull_request:
    paths:
      - "nsa/residency/**"
      - "nsa/runtime/inference/**"
      - "experiments/residency/**"
      - "scripts/residency_smoke_test.py"
      - "scripts/run_residency_experiments.sh"
      - "tests/test_residency*.py"
      - "tests/test_active_residency*.py"
      - "tests/test_accelerate_prefetch.py"
      - "tests/test_resident_backend.py"
      - "tests/tiny_qwen.py"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/residency-smoke.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,ml-residency]"
      - name: Residency smoke test (through the Makefile entrypoint)
        run: make residency-smoke PYTHON=python
      - name: Residency unit and end-to-end tests
        run: >
          python -m pytest -q -rs
          tests/test_residency.py
          tests/test_active_residency.py
          tests/test_active_residency_async.py
          tests/test_residency_trace.py
          tests/test_residency_sizing.py
          tests/test_accelerate_prefetch.py
          tests/test_resident_backend.py
          tests/test_residency_benchmark.py
      - name: Fail if the end-to-end tests were skipped
        run: >
          python -m pytest -q -rs tests/test_resident_backend.py tests/test_residency_benchmark.py
          | tee /tmp/e2e.txt; ! grep -q skipped /tmp/e2e.txt
      - name: Compile residency experiment harness
        run: >
          python -m compileall -q
          nsa/residency
          nsa/runtime/inference
          experiments/residency
          scripts/residency_smoke_test.py
      - name: Validate experiment CLI
        run: python -m experiments.residency.benchmark_matrix --help
      - name: Validate experiment runner
        run: bash -n scripts/run_residency_experiments.sh
