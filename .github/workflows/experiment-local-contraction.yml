name: NSA Local Self-State Contraction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/local_contraction.py'
      - 'tests/test_local_contraction.py'
      - '.github/workflows/experiment-local-contraction.yml'
  push:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/local_contraction.py'
      - 'tests/test_local_contraction.py'
      - '.github/workflows/experiment-local-contraction.yml'

jobs:
  local-contraction:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 7, 21, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run local contraction experiment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          PYTHONPATH=. python experiments/self_state/local_contraction.py \
            --seed ${{ matrix.seed }} \
            | tee results/local-contraction-${{ matrix.seed }}.json
      - name: Validate result
        env:
          RESULT: results/local-contraction-${{ matrix.seed }}.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          assert result['finite'] is True
          assert result['summary']['max_security_delta'] == 0.0
          assert len(result['results']) == len(result['perturbations'])
          print('Validated', os.environ['RESULT'])
          PY
      - name: Publish result summary
        run: |
          echo '## Local self-state contraction — seed ${{ matrix.seed }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results/local-contraction-${{ matrix.seed }}.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: local-contraction-seed-${{ matrix.seed }}
          path: results/local-contraction-${{ matrix.seed }}.json

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_local_contraction.py
