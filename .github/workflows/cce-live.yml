name: CCE live Ollama evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        required: false
        default: qwen2.5:0.5b
      ticks:
        description: Number of continuous transitions
        required: false
        default: "2"
  schedule:
    - cron: "17 3 * * *"

jobs:
  live-cce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0,<2.5.0" "numpy>=1.24.0,<3.0.0"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama model store
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ inputs.model || 'qwen2.5:0.5b' }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Ensure test model is available
        env:
          CCE_MODEL: ${{ inputs.model || 'qwen2.5:0.5b' }}
        run: |
          if ollama list | awk 'NR > 1 {print $1}' | grep -Fxq "$CCE_MODEL"; then
            echo "Ollama cache hit: $CCE_MODEL"
          else
            echo "Ollama cache miss: pulling $CCE_MODEL"
            ollama pull "$CCE_MODEL"
          fi

      - name: Run matched real-Ollama baseline vs NSA benchmark
        env:
          CCE_MODEL: ${{ inputs.model || 'qwen2.5:0.5b' }}
        run: |
          mkdir -p results/ci/cce
          PYTHONPATH=. python experiments/live/ollama_matched_benchmark.py \
            --model "$CCE_MODEL" \
            --max-tokens 64 \
            --temperature 0.0 \
            --output results/ci/cce/ollama_matched.json

      - name: Run clocked vs continuous CCE experiment
        env:
          CCE_MODEL: ${{ inputs.model || 'qwen2.5:0.5b' }}
          CCE_TICKS: ${{ inputs.ticks || '2' }}
        run: |
          PYTHONPATH=. python experiments/live/cce_ollama_continuous_smoke.py \
            --model "$CCE_MODEL" \
            --ticks "$CCE_TICKS" \
            --interval 1.0 \
            --output results/ci/cce/continuous.json

      - name: Upload CCE/Ollama results
        uses: actions/upload-artifact@v4
        with:
          name: cce-live-ollama-results
          path: results/ci/cce/
          if-no-files-found: error
