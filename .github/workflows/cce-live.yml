name: "[manual] CCE live Ollama evaluation"

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        required: false
        default: qwen2.5:0.5b
      ticks:
        description: Number of continuous transitions
        required: false
        default: "2"

env:
  CCE_MODEL: ${{ inputs.model || 'qwen2.5:0.5b' }}
  CCE_TICKS: ${{ inputs.ticks || '2' }}

permissions:
  contents: read

jobs:
  live-cce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Install Ollama
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://ollama.com/install.sh | sh; then exit 0; fi
            echo "Ollama installer attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done
          exit 1
      - name: Cache Ollama model store
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.CCE_MODEL }}
          restore-keys: ollama-${{ runner.os }}-
      - name: Start Ollama
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Ensure test model is available
        run: |
          if ollama list | awk 'NR > 1 {print $1}' | grep -Fxq "$CCE_MODEL"; then
            echo "Ollama cache hit: $CCE_MODEL"
          else
            ollama pull "$CCE_MODEL"
          fi
      - name: Run matched real-Ollama baseline vs NSA benchmark
        run: |
          mkdir -p results/ci/cce
          PYTHONPATH=. python experiments/live/ollama_matched_benchmark.py --model "$CCE_MODEL" --max-tokens 64 --temperature 0.0 --output results/ci/cce/ollama_matched.json
      - name: Run clocked vs continuous CCE experiment
        run: |
          PYTHONPATH=. python experiments/live/cce_ollama_continuous_smoke.py --model "$CCE_MODEL" --ticks "$CCE_TICKS" --interval 1.0 --output results/ci/cce/continuous.json
      - name: Run predictive continuous-state benchmark
        run: PYTHONPATH=. python experiments/live/cce_predictive_dynamics.py --epochs 250 --samples 128 --output results/ci/cce/predictive_dynamics.json
      - name: Run adaptive salience runtime experiment
        run: PYTHONPATH=. python experiments/cce_salience_runtime.py --steps 64 --seed 42 --output results/ci/cce/salience.json
      - name: Run closed-loop salience-gated Ollama invocation
        run: PYTHONPATH=. python experiments/cce_closed_loop_runtime.py --model "$CCE_MODEL" --steps 16 --seed 42 --mode ollama --output results/ci/cce/closed_loop.json
      - name: Run event-driven versus fixed-rate Ollama experiment
        run: PYTHONPATH=. python experiments/live/cce_event_vs_fixed_rate.py --model "$CCE_MODEL" --steps 8 --interval 0.25 --max-tokens 32 --seed 42 --output results/ci/cce/event_vs_fixed.json
      - name: Run persistent cognitive-state wall-clock experiment
        run: PYTHONPATH=. python experiments/cce_persistent_state_runtime.py --dimension 4 --settle-seconds 0.5 --observations 4 --output results/ci/cce/persistent_state.json
      - name: Validate collected CCE evidence
        run: echo "validation deferred to experiment outputs"
      - name: Upload CCE/Ollama results
        uses: actions/upload-artifact@v6
        with:
          name: cce-live-ollama-results
          path: results/ci/cce/
          if-no-files-found: error
