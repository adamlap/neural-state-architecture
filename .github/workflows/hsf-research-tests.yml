name: HSF research tests

on:
  push:
    branches:
      - research/holographic-state-field
  pull_request:
    branches:
      - research/holographic-state-field
  workflow_dispatch:

jobs:
  hsf-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run HSF research tests
        run: >-
          python -m pytest -q
          tests/test_holographic_state_field.py
          tests/test_holographic_associative_baselines.py
          tests/test_holographic_correlated_keys.py
          tests/test_holographic_allocation_benchmark.py\n          tests/test_holographic_plasticity.py
