name: CCE structured-state context

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        required: false
        default: qwen2.5:0.5b

env:
  CCE_MODEL: ${{ inputs.model || 'qwen2.5:0.5b' }}

permissions:
  contents: read

jobs:
  structured-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Install Ollama
        run: curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://ollama.com/install.sh | sh
      - name: Cache Ollama model store
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.CCE_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-
      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Ensure test model is available
        run: |
          if ! ollama list | awk 'NR > 1 {print $1}' | grep -Fxq "$CCE_MODEL"; then
            ollama pull "$CCE_MODEL"
          fi
      - name: Run structured persistent-state context experiment
        run: |
          mkdir -p results/ci/cce
          PYTHONPATH=. python experiments/cce_structured_context_runtime.py --model "$CCE_MODEL" --output results/ci/cce/structured_context.json
      - name: Validate structured context evidence
        run: echo "validation deferred to experiment output"
      - name: Upload structured context evidence
        uses: actions/upload-artifact@v6
        with:
          name: cce-structured-context-results
          path: results/ci/cce/structured_context.json
          if-no-files-found: error
