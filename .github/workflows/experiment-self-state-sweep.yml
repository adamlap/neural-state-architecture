name: NSA Self-State Perturbation Sweep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/**'
      - '.github/workflows/experiment-self-state-sweep.yml'
  push:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/**'
      - '.github/workflows/experiment-self-state-sweep.yml'

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 7, 21, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run normalized perturbation sweep
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          PYTHONPATH=. python experiments/self_state/perturbation_sweep.py \
            --seed ${{ matrix.seed }} \
            | tee results/self-state-sweep-${{ matrix.seed }}.json
      - name: Validate experiment result
        env:
          RESULT: results/self-state-sweep-${{ matrix.seed }}.json
        run: |
          python - <<'PY'
          import json, os
          path = os.environ["RESULT"]
          with open(path, encoding="utf-8") as f:
              result = json.load(f)
          assert result["finite"] is True
          assert len(result["results"]) == len(result["perturbations"])
          assert all("recovery_advantage" in row for row in result["results"])
          assert all("auc_advantage" in row for row in result["results"])
          print("Validated", path)
          PY
      - name: Add result to job summary
        run: |
          echo '## Self-state sweep — seed ${{ matrix.seed }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results/self-state-sweep-${{ matrix.seed }}.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: self-state-sweep-seed-${{ matrix.seed }}
          path: results/self-state-sweep-${{ matrix.seed }}.json

  aggregate:
    name: Aggregate self-state sweep evidence
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: self-state-sweep-seed-*
          path: results
          merge-multiple: true
      - name: Validate artifact count
        run: |
          test "$(find results -name 'self-state-sweep-*.json' | wc -l)" -eq 4
      - name: Aggregate sweep evidence
        run: |
          python experiments/self_state/summarize_sweep.py \
            results/self-state-sweep-*.json \
            --output results/self-state-sweep-summary.json
      - name: Publish aggregate evidence
        if: always()
        run: |
          echo '## Self-state perturbation sweep — aggregate evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results/self-state-sweep-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: self-state-sweep-aggregate
          path: results/self-state-sweep-summary.json
