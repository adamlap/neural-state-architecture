name: NSA tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.0.0,<2.5.0" "pytest>=7.0.0"
      - name: Run test suite
        run: PYTHONPATH=. python -m pytest -q tests/
      - name: Run self-state smoke experiment
        run: PYTHONPATH=. python experiments/self_state/run.py --steps 20 --seed 7
