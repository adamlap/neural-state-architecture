name: NSA tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      snm_enabled:
        description: "Enable Strategic Neural Modulation for the configuration probe"
        required: true
        default: true
        type: boolean
      snm_feedback_enabled:
        description: "Enable SNM prediction-error feedback for the configuration probe"
        required: true
        default: true
        type: boolean
      snm_attention_enabled:
        description: "Enable SNM attention modulation for the configuration probe"
        required: true
        default: true
        type: boolean
      run_hsf_research_benchmarks:
        description: "Run HSF allocation, correlated-key, and plasticity benchmarks"
        required: false
        default: false
        type: boolean

concurrency:
  group: nsa-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - name: Lint for undefined names and syntax errors
        run: |
          python -m pip install ruff
          ruff check --select F821,E9 nsa experiments tests
      - name: Run test suite
        run: PYTHONPATH=. python -m pytest -q tests/
      - name: Run focused SNM tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_strategic_config.py
          tests/test_strategic_feedback.py
          tests/test_strategic_system_one.py
          tests/test_strategic_torch_adapter.py
      - name: Verify configurable SNM runtime
        env:
          NSA_SNM_ENABLED: ${{ github.event.inputs.snm_enabled || 'true' }}
          NSA_SNM_FEEDBACK_ENABLED: ${{ github.event.inputs.snm_feedback_enabled || 'true' }}
          NSA_SNM_ATTENTION_ENABLED: ${{ github.event.inputs.snm_attention_enabled || 'true' }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import os
          from nsa.strategy import StrategicConfig
          cfg = StrategicConfig.from_env()
          expected = {
              "enabled": os.environ["NSA_SNM_ENABLED"].lower() == "true",
              "feedback_enabled": os.environ["NSA_SNM_FEEDBACK_ENABLED"].lower() == "true",
              "attention_enabled": os.environ["NSA_SNM_ATTENTION_ENABLED"].lower() == "true",
          }
          assert cfg.enabled is expected["enabled"]
          assert cfg.feedback_enabled is expected["feedback_enabled"]
          assert cfg.attention_enabled is expected["attention_enabled"]
          print("SNM configuration:", cfg)
          PY
      - name: Run CCE runtime invariants
        run: PYTHONPATH=. python -m pytest -q tests/test_continuous_engine.py tests/test_cce_fail_closed.py
      - name: Run self-state smoke experiment
        run: PYTHONPATH=. python experiments/self_state/run.py --steps 20 --seed 7
      - name: Run native NSA transformer probe
        run: PYTHONPATH=. python experiments/self_state/transformer_probe.py --batch 2 --seq-len 8

      - name: Run HSF research benchmarks
        if: github.event_name == 'workflow_dispatch' && inputs.run_hsf_research_benchmarks
        run: |
          mkdir -p results
          PYTHONPATH=. python -m experiments.holographic_state_field.correlated_key_benchmark --out results/hsf_correlated_keys_v1.json
          PYTHONPATH=. python -m experiments.holographic_state_field.allocation_benchmark --out results/hsf_allocation_v1.json
          PYTHONPATH=. python -m experiments.holographic_state_field.plasticity_benchmark --out results/hsf_plasticity_v1.json
      - name: Upload HSF research results
        if: github.event_name == 'workflow_dispatch' && inputs.run_hsf_research_benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: hsf-research-results
          path: results/*.json
          if-no-files-found: error
