name: CCE Cognitive Architecture Benchmark

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Space-separated integer seeds"
        required: false
        default: "7 17 37 73 137"
      horizon:
        description: "Episode horizon"
        required: false
        default: "60"
  pull_request:
    paths:
      - "experiments/cognitive/**"
      - "tests/test_cognitive_benchmark.py"
      - "tests/test_dynamic_cognitive_benchmark.py"
      - "docs/COGNITIVE_ARCHITECTURE_EXPERIMENT.md"

jobs:
  deterministic-cognitive-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7.0.0"
      - name: Run retention benchmark
        env:
          PYTHONPATH: .
        run: |
          python experiments/cognitive/benchmark.py \
            --seeds ${{ github.event.inputs.seeds || '7 17 37 73 137' }} \
            --horizon 80 \
            --out results/cognitive_architecture_benchmark.json
      - name: Run dynamic cognition benchmark
        env:
          PYTHONPATH: .
        run: |
          python experiments/cognitive/dynamic_benchmark.py \
            --seeds ${{ github.event.inputs.seeds || '7 17 37 73 137' }} \
            --horizon ${{ github.event.inputs.horizon || '60' }} \
            --out results/dynamic_cognition_benchmark.json
      - name: Run benchmark tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cognitive_benchmark.py tests/test_dynamic_cognitive_benchmark.py
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cce-cognitive-benchmarks
          path: results/*cognitive*benchmark.json
          if-no-files-found: error
