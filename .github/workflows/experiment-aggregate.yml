name: NSA Experiment Aggregate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NSA Self-State Recovery Experiment"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,research]'
      - name: Download artifacts from triggering recovery run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p results/recovery
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("recovery-seed-")) | [.id, .name] | @tsv' \
            > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id name; do
            [ -z "$id" ] && continue
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              > "/tmp/${name}.zip"
            unzip -o "/tmp/${name}.zip" -d results/recovery >/dev/null
          done < /tmp/artifacts.tsv
          test -n "$(find results/recovery -name '*.json' -print -quit)"
      - name: Aggregate recovery results
        run: |
          PYTHONPATH=. python -m experiments.common.aggregate results/recovery --output results/recovery-aggregate.json
      - name: Upload aggregate results
        uses: actions/upload-artifact@v4
        with:
          name: nsa-recovery-aggregate
          path: results/recovery-aggregate.json
