name: "[auto] Live Ollama policy verification"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nsa/policy.py"
      - "nsa/enforcement.py"
      - "nsa/decision.py"
      - "scripts/policy_server.py"
      - "examples/policies/**"
      - "experiments/live/policy_ollama_live_test.py"
      - ".github/workflows/policy-live-ollama.yml"
  workflow_dispatch:
    inputs:
      policy:
        description: "Policy file to verify"
        required: true
        default: "examples/policies/safe_assistant.json"
      model:
        description: "Ollama model"
        required: true
        default: "qwen2.5:0.5b"

concurrency:
  group: live-ollama-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NSA_POLICY: ${{ github.event.inputs.policy || 'examples/policies/safe_assistant.json' }}
  NSA_OLLAMA_MODEL: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}

jobs:
  live-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0,<2.5.0" "numpy>=1.24.0,<3.0.0" "pytest>=7.0.0" "hypothesis>=6.100.0"

      - name: Install Ollama
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull live test model
        run: ollama pull "$NSA_OLLAMA_MODEL"

      - name: Verify policy contract first
        run: PYTHONPATH=. python -m pytest -q tests/test_integration_policy_contract.py

      - name: Test configured policy against live Ollama
        run: |
          mkdir -p results/ci/policy
          PYTHONPATH=. python experiments/live/policy_ollama_live_test.py \
            --policy "$NSA_POLICY" \
            --model "$NSA_OLLAMA_MODEL" \
            --output results/ci/policy/live_ollama.json

      - name: Upload policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-ollama-policy-evidence
          path: results/ci/policy/live_ollama.json
          if-no-files-found: error
