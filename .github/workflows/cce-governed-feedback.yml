name: "[auto] CCE governed feedback"

on:
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev,research]"
      - run: PYTHONPATH=. pytest -q tests/test_cce_governed_feedback.py
      - run: mkdir -p results/ci/cce && PYTHONPATH=. python experiments/cce_governed_feedback_runtime.py --output results/ci/cce/governed_feedback.json
      - uses: actions/upload-artifact@v7
        with:
          name: cce-governed-feedback-results
          path: results/ci/cce/governed_feedback.json
