name: NSA benchmark experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/**'
      - '.github/workflows/experiment-benchmark.yml'
  push:
    paths:
      - 'nsa/**'
      - 'experiments/self_state/**'
      - '.github/workflows/experiment-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 7, 21, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0,<2.5.0" "numpy>=1.24.0,<3.0.0"
      - name: Run explicit self-state benchmark
        run: |
          PYTHONPATH=. python experiments/self_state/run.py --seed ${{ matrix.seed }} --steps 300 --batch-size 128 > benchmark-${{ matrix.seed }}.json
      - name: Run native cognitive ablation
        run: |
          PYTHONPATH=. python experiments/self_state/causal_ablation.py --seed ${{ matrix.seed }} > cognitive-${{ matrix.seed }}.json
      - name: Run perturbation/recovery test
        run: |
          PYTHONPATH=. python experiments/self_state/perturbation_recovery.py --seed ${{ matrix.seed }} > recovery-${{ matrix.seed }}.json
      - name: Upload seed results
        uses: actions/upload-artifact@v4
        with:
          name: nsa-benchmark-seed-${{ matrix.seed }}
          path: '*.json'
